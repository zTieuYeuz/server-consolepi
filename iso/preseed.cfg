# Console System - dien san cac cau hoi khong nguy hiem cua trinh cai dat.
#
# NGUYEN TAC AN TOAN QUAN TRONG: TUYET DOI khong dien san phan CHON O DIA
# va CHIA PHAN VUNG. Dien san may cau do nghia la trinh cai dat tu chon o
# roi xoa sach ma khong hoi - cam nham vao may co du lieu cua khach la mat
# trang. Hai muc do PHAI de nguoi cai tu bam, tu nhin, tu xac nhan.
#
# O day chi dien nhung thu doi lai duoc va khong pha gi: ngon ngu, ban
# phim, mui gio, ten may.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i time/zone string Asia/Ho_Chi_Minh
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

d-i netcfg/get_hostname string console-system
d-i netcfg/get_domain string local
# Khong hoi chon cong mang neu may chi co mot cong
d-i netcfg/choose_interface select auto

# LOI THAT DA GAP (22/09/2026, anh Thoai cai xong khong sudo duoc):
# "administrator is not in the sudoers file. This incident will be
# reported." - tai khoan tao luc cai KHONG duoc them vao nhom sudo, moi
# lenh sudo (ke ca cua chinh he thong: kiosk, cai dat mang...) deu chet
# ngay tu dau. Nguyen nhan: user-setup cua d-i chi tu them "sudo" vao
# nhom mac dinh NEU gia goi sudo da co san trong kho luc no hoi tao tai
# khoan - nhung goi sudo cua du an nam trong danh-sach-goi.txt rieng,
# duoc cai o buoc SAU do, nen user-setup khong thay va bo qua. Dien san
# thang danh sach nhom de khong con phu thuoc thoi diem nua.
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev sudo

# Khong hoi "nap firmware tu USB/dia mem". LOI THAT (22/09/2026, mini PC
# that): bo cai dung han o hop thoai nay vi card Realtek. Firmware can cho
# card mang da nhung san trong bo cai (dung-iso.sh) va trong /firmware cua
# ISO - bo cai van tu tim o do lan dau, chi la khong bat nguoi dung di tim
# USB nua. Thieu firmware cung khong can tro viec cai: may cai tu chinh
# anh dia, khong can mang.
d-i hw-detect/load_firmware boolean false

# Cai GRUB them vao duong du phong \EFI\BOOT\BOOTX64.EFI. Rat nhieu mini PC
# va bo mach gia re BO QUA muc boot bo cai ghi vao NVRAM, chi tim dung
# duong du phong nay - cai xong rut USB ra la "khong co he dieu hanh".
# Them duong nay khong hai gi voi may binh thuong.
d-i grub-installer/force-efi-extra-removable boolean true

# Khong gui thong ke su dung goi
popularity-contest/participate boolean false

# Khong hoi "quet them dia CD khac"
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
# Khong them dong deb-src (may khong bien dich tu nguon; apt update nhanh hon)
d-i apt-setup/enable-source-repositories boolean false

# Trinh cai CHU (d-i) chep nguyen he thong tu USB, gom ca trinh cai do hoa
# Calamares + thu vien Qt (~200MB) chi dung trong phien USB. Go di cho may
# da cai gon nhu khi cai bang Calamares (ben do packages.conf lam viec nay).
# Chi go goi, khong dung toi o dia. Dau "|| true": thieu goi nao cung khong
# lam hong ca buoc cai.
d-i preseed/late_command string in-target sh -c 'if dpkg -s calamares >/dev/null 2>&1; then apt-get -y purge calamares qt6-wayland qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript polkitd; apt-get -y autoremove --purge; fi; rm -rf /etc/calamares /usr/share/calamares /usr/local/sbin/console-system-grub-install; systemctl disable console-system-cai.service; rm -f /etc/systemd/system/console-system-cai.service' || true
