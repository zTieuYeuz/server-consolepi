# Console System - dien san cac cau hoi khong nguy hiem cua trinh cai dat.
#
# NGUYEN TAC AN TOAN QUAN TRONG: TUYET DOI khong dien san phan CHON O DIA
# va CHIA PHAN VUNG. Dien san may cau do nghia la trinh cai dat tu chon o
# roi xoa sach ma khong hoi - cam nham vao may co du lieu cua khach la mat
# trang. Hai muc do PHAI de nguoi cai tu bam, tu nhin, tu xac nhan.
#
# O day chi dien nhung thu doi lai duoc va khong pha gi: ngon ngu, ban
# phim, mui gio, ten may.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i time/zone string Asia/Ho_Chi_Minh
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

d-i netcfg/get_hostname string console-system
d-i netcfg/get_domain string local
# Khong hoi chon cong mang neu may chi co mot cong
d-i netcfg/choose_interface select auto

# Khong gui thong ke su dung goi
popularity-contest/participate boolean false

# Khong hoi "quet them dia CD khac"
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
