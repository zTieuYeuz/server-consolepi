# Cai goi GRUB dung loai may. KHAI RO ban da ky + shim cho may UEFI thay vi
# trong cho apt tu keo "goi khuyen nghi" - ban 1.1.4 mat dung cho nay nen may
# bat Secure Boot cai xong khong boot duoc.
# May BIOS: chi grub-pc. KHONG duoc cai grub-efi-amd64-signed o day - goi do
# Protected, cai nham se khong go ra duoc.
---
dontChroot: false
timeout: 900
script:
    - command: "if [ -d /sys/firmware/efi ]; then DEBIAN_FRONTEND=noninteractive apt-get -y -o Dir::Etc::sourcelist=sources.list.d/console-system-usb.list -o Dir::Etc::sourceparts=- install grub-efi-amd64 grub-efi-amd64-signed shim-signed efibootmgr; else DEBIAN_FRONTEND=noninteractive apt-get -y -o Dir::Etc::sourcelist=sources.list.d/console-system-usb.list -o Dir::Etc::sourceparts=- install grub-pc; fi"
      timeout: 900
