---
efiBootLoader:    "grub"
# Wrapper them --force-extra-removable khi cai kieu UEFI: grub-install cua
# Debian khi do tu chep CA shim (da ky boi Microsoft) + grub vao
# /EFI/BOOT/BOOTX64.EFI. Xem /usr/local/sbin/console-system-grub-install.
grubInstall:      "/usr/local/sbin/console-system-grub-install"
grubMkconfig:     "grub-mkconfig"
grubCfg:          "/boot/grub/grub.cfg"
grubProbe:        "grub-probe"
efiBootMgr:       "efibootmgr"
# Giong ten thu muc ban d-i tao ra (EFI/console) - may cai bang cach nao
# cung giong nhau.
efiBootloaderId:  "console"
# PHAI TAT. Buoc du phong cua Calamares chep grubx64.efi thanh BOOTX64.EFI:
# may bat Secure Boot chi tin shim, se TU CHOI grub chay truc tiep -> mini
# PC nao chi boot bang duong du phong se "khong boot duoc" (dung loi da gap
# o ban 1.1.4). Duong du phong do wrapper o tren lo, co shim dung cho.
installEFIFallback: false
timeout:          "5"
