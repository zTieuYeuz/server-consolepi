# Cho he thong dich cai goi tu CHINH USB (khong can Internet): gan thu muc
# USB vao trong va chi cho apt doc dung nguon do. USB co san kho goi GRUB/
# shim da ky (live-build chep vao cho trinh cai d-i dung).
---
dontChroot: true
timeout: 120
script:
    - "mkdir -p ${ROOT}/run/live/medium"
    - "mount --bind /run/live/medium ${ROOT}/run/live/medium"
    - "echo 'deb [trusted=yes] file:/run/live/medium trixie main' > ${ROOT}/etc/apt/sources.list.d/console-system-usb.list"
    - command: "chroot ${ROOT} apt-get update -o Dir::Etc::sourcelist=sources.list.d/console-system-usb.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0"
      timeout: 300
