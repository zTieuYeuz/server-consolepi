---
efi:
    mountPoint:       "/boot/efi"
    recommendedSize:  300MiB
    minimumSize:      32MiB
    label:            "EFI"

# KHONG chon san phuong an nao: nguoi cai phai tu bam "Xoa o dia" /
# "Cai canh" / "Chia thu cong" va tu chon o. Chon san la co ngay xoa nham
# o chua du lieu cua khach - cung nguyen tac voi preseed cua ban d-i.
initialPartitioningChoice: none

userSwapChoices:
    - none
    - file
initialSwapChoice: file

drawNestedPartitions:        false
alwaysShowPartitionLabels:   true
allowManualPartitioning:     true
showNotEncryptedBootMessage: false
# KHONG cho ma hoa o dia: anh dia khong co cryptsetup/cryptsetup-initramfs,
# khach tick "Ma hoa he thong" la may cai xong khong mo khoa duoc luc boot
# (bat duoc khi cai thu 22/09/2026). Muon ho tro thi phai them 2 goi do va
# test du duong mo khoa truoc.
enableLuksAutomatedPartitioning: false

defaultFileSystemType:    "ext4"
availableFileSystemTypes: ["ext4", "xfs", "btrfs"]
