---
# Go cac goi chi dung cho phien USB. Backend apt tu chay "autoremove" sau
# khi go, nen thu vien Qt keo theo calamares cung duoc don khoi may da cai.
# Dung "remove" (go mot lan) chu khong "try_remove": try_remove go TUNG goi
# va chay autoremove sau moi goi - lan thu dau mat ~4 phut cho 11 goi. Moi
# goi o day deu nam trong danh-sach-goi.txt nen chac chan co mat.
backend: apt
skip_if_no_internet: false
update_db: false
operations:
  - remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - live-tools
      - calamares
      - qt6-wayland
      - qml6-module-qtquick
      - qml6-module-qtquick-window
      - qml6-module-qtqml-workerscript
      - polkitd
