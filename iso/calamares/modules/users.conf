---
# "sudo" PHAI co trong danh sach: tai khoan nay la tai khoan dang nhap web
# va la tai khoan quan tri duy nhat (khong dat mat khau root). Ban d-i tung
# bo sot nhom nay - xem CHANGELOG 1.1.4.
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - users
autologinGroup:            autologin
doAutologin:               false
sudoersGroup:              sudo
sudoersConfigureWithGroup: true
setRootPassword:           false
doReusePassword:           false
userShell:                 /bin/bash

passwordRequirements:
    minLength: 1
allowWeakPasswords:        true
allowWeakPasswordsDefault: true

hostname:
    location:        EtcFile
    writeHostsFile:  true
    template:        "console-system"
    forbidden_names: [ localhost ]
