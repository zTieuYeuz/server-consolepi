# Don nhung thu chi phuc vu phien USB/trinh cai, de may da cai sach nhu
# may cai bang d-i.
---
dontChroot: false
timeout: 120
script:
    # LOI THAT (kiem chung 22/09/2026): may cai bang Calamares KHONG co khoa
    # SSH (/etc/ssh/ssh_host_*_key) -> ssh.service chet ngay khi boot.
    # live-build co y xoa khoa khoi ISO (moi may cai tu ISO se dung chung
    # mot khoa neu de lai); trinh cai d-i tu tao lai, Calamares thi khong.
    # Tao o day: moi may mot bo khoa rieng, sinh tai luc cai.
    - "ssh-keygen -A"
    # Dong nguon "file:/run/live/medium" live-build de trong sources.list:
    # rut USB ra thi apt update se bao loi moi lan.
    - "-sed -i '/file:\\/run\\/live\\/medium/d' /etc/apt/sources.list"
    # Bo cac dong deb-src: may nay khong bien dich goi tu nguon, de lai chi
    # lam moi lan apt update tai gap doi chi muc (cham tren mang yeu).
    - "-sed -i '/^deb-src /d' /etc/apt/sources.list"
    # May khong co goi locales (giu nhe): dat C.UTF-8 co san trong glibc,
    # tranh canh bao "setlocale failed" neu trinh cai ghi vi_VN.UTF-8.
    - "echo 'LANG=C.UTF-8' > /etc/default/locale"
    - "-rm -rf /etc/calamares /usr/share/calamares /usr/share/console-system/calamares"
    - "-rm -f /usr/local/sbin/console-system-grub-install"
    - "-rm -f /etc/systemd/system/console-system-cai.service /etc/systemd/system/multi-user.target.wants/console-system-cai.service"
    - "-rm -f /etc/systemd/system/console-pi-kiosk.service.d/05-khi-cai-dat.conf /etc/systemd/system/console-pi-kiosk-helper.service.d/05-khi-cai-dat.conf"
