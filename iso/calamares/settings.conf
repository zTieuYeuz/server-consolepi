# Console System - trinh cai dat do hoa (Calamares).
#
# Dung THAY cho man hinh xanh cua Debian (anh Thoai yeu cau 22/09/2026:
# "lam giong nhu Windows ma hinh dep ... khong dung mac dinh cua debian").
# Trinh cai chu (d-i) VAN GIU lam muc du phong trong menu boot, vi may nao
# loi do hoa thi Calamares khong hien duoc.
#
# NGUYEN TAC AN TOAN (giu nguyen tu ban d-i): KHONG tu chon o dia, KHONG tu
# xoa gi. Trang chia o dia de trong mac dinh (partition.conf:
# initialPartitioningChoice: none), nguoi cai phai tu chon va xac nhan.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       nguonusb
  module:   shellprocess
  config:   shellprocess-nguonusb.conf
- id:       caigrub
  module:   shellprocess
  config:   shellprocess-caigrub.conf
- id:       bonguonusb
  module:   shellprocess
  config:   shellprocess-bonguonusb.conf
- id:       dondep
  module:   shellprocess
  config:   shellprocess-dondep.conf

sequence:
- show:
  - welcome
  - locale
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - localecfg
  - luksbootkeyfile
  - users
  - networkcfg
  - hwclock
  - shellprocess@nguonusb
  - shellprocess@caigrub
  - grubcfg
  - bootloader
  - packages
  - initramfscfg
  - initramfs
  - shellprocess@bonguonusb
  - shellprocess@dondep
  - umount
- show:
  - finished

branding: consolesystem

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
