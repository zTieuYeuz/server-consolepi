# ===================================================================
# Mau sac menu boot UEFI
# ===================================================================
# CO Y KHONG dung theme do hoa (anh nen) cho menu UEFI, du menu BIOS co.
#
# LY DO - theme do hoa cua live-build BI LOI SAN, da kiem chung that
# (21/09/2026, boot trong may ao co OVMF): khi theme duoc bat, GRUB ve mot
# O DEN DAC che kin giua man hinh (do duoc: left 10%, top 18%, rong 81%,
# cao 73%) - dung ngay len vung ve danh sach muc chon, nen man hinh chi
# con anh nen, dong tieu de va thanh dem lui, KHONG THAY MUC NAO de bam.
#
# Da loai tru ky truoc khi ket luan:
#   - thu bo chu thich minh them vao theme        -> anh chup trung MD5, y nguyen
#   - thu them "insmod gfxmenu"                   -> trung MD5, y nguyen
#   - thu chen mot dong chu thu nghiem mau do     -> HIEN RA, tuc file theme
#                                                    cua minh that su duoc dung
#   - thu dung theme GOC cua live-build, khong  -> VAN BI O DEN Y HET
#     sua mot chu nao
# Ket luan: loi nam trong theme cua live-build / GRUB 2.12, khong phai do
# minh sua. Sua tan goc phai dung vao ruot GRUB - khong dang danh doi voi
# mot thu chi la trang tri, trong khi de nguyen thi nguoi dung KHONG BAM
# DUOC vao dau ca.
#
# Nen: khong sinh splash.png cho GRUB (xem dung-iso.sh - co y khong chep
# anh nen sang thu muc grub-pc), de GRUB dung menu chu binh thuong. Doi
# mau lai cho hop tong Console System (xanh cyan tren nen toi) thay vi
# mau xanh duong mac dinh cua live-build.
set color_normal=light-gray/black
set color_highlight=black/light-cyan
set menu_color_normal=light-cyan/black
set menu_color_highlight=black/light-cyan
