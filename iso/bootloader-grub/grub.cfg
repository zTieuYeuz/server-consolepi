# ===================================================================
# Console System - menu boot cho may khoi dong kieu UEFI
# ===================================================================
# VI SAO CAN FILE NAY: menu tieng Viet 3 muc ma anh Thoai duyet nam o
# config/bootloaders/isolinux/ - ma isolinux CHI chay khi may boot kieu
# BIOS. May boot kieu UEFI di duong khac hoan toan (GRUB doc file nay),
# nen truoc day van hien menu mac dinh cua live-build: 5 muc tieng Anh
# "Live system (amd64)" / "Start installer" / "Advanced install
# options ..." / "Utilities...". Da chup man hinh xac nhan 21/09/2026.
#
# HAI LOI CUNG DUOC SUA O DAY:
#  1. Menu UEFI DOI MAI KHONG TU CHAY. live-build khong dat timeout cho
#     GRUB. Da do that: boot thu trong may ao, sau 2 phut anh chup man
#     hinh van trung MD5 tung byte voi luc dau - tuc khong he dem lui.
#     May cam trong rack khong co ban phim se dung im vinh vien. Ban
#     BIOS da sua bang "timeout 50" tu truoc, ban UEFI thi chua ai sua.
#  2. Con nguyen 2 muc long nhau da bi bo ben BIOS ("Advanced install
#     options" va "Utilities") - bo not cho khop.
#
# LUU Y KHI SUA FILE NAY: live-build thay the ca nhung chu KHONG co dau
# @ bao quanh (de tuong thich nguoc) - vi du chu KERNEL hay APPEND viet
# lien voi LIVE. Tranh viet cac chu do trong chu thich keo bi thay nham.

source /boot/grub/config.cfg

# Tu chay muc dau sau 5 giay - khop voi ban BIOS (isolinux: timeout 50)
set default=0
set timeout=5

menuentry "Chay thu Console System (khong cai gi vao may)" --hotkey=c {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Chay thu - che do an toan (may kho tinh)" --hotkey=a {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

# Muc cai len o cung - noi dung o install_start.cfg (live-build tu chon
# ban chu hay ban do hoa roi dat ten file thanh install_start.cfg)
if @ENABLE_INSTALL_MENU@; then
	source	/boot/grub/install_start.cfg
fi
