# Muc "cai len o cung" cua menu UEFI. Doi ten cho khop ban BIOS
# (config/bootloaders/isolinux/install_text.cfg). Tham so giu y nguyen
# khuon mau goc cua live-build, chi doi chu hien ra.
menuentry 'CAI Console System len o cung' --hotkey=i {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}
