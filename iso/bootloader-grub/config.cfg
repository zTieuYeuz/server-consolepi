# Cau hinh man hinh cho menu boot UEFI cua USB/ISO
# ===================================================================
# Ban goc cua live-build (/usr/share/live/build/bootloaders/grub-pc/
# config.cfg) - GIU NGUYEN tung dong, CHI DOI 1 cho: gfxmode.
#
# LOI THAT 29/09/2026 (Dell OptiPlex 3070 + man hinh Full HD qua HDMI):
# ban goc ep gfxmode=800x600 (chep tu ban netinst). May ao man hinh cung
# 800x600 nen vua khit; may that man 16:9 thi phai keo gian 800x600 (4:3)
# -> chu phong to, khung menu TRAN ra ngoai mep phai, dong huong dan o day
# bi cat mat (anh Thoai chup lai). He thong DA CAI tren o cung dung
# gfxmode=auto (mac dinh cua Debian) va chay dung 1920x1080 tren chinh may
# do (dmesg: "efifb: mode is 1920x1080x32") -> dung dung cach do cho USB:
# "auto" = do phan giai goc man hinh bao (EDID), khong keo gian.

set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
