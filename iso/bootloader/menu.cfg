menu hshift 0
menu width 82

# 'menu title' de TRONG - anh nen splash.png (config/bootloaders/isolinux/)
# da co san chu "CONSOLE SYSTEM" + khau hieu + logo ve san trong anh nen,
# neu con ghi them dong tieu de o day se bi LAP CHU HAI LAN chong nhau
# tren man hinh (da phat hien va sua sau khi boot thu that trong QEMU).
menu title
include stdmenu.cfg
include live.cfg
@OPTIONAL_INSTALLER_INCLUDE@
menu begin utilities
	menu label ^Utilities
	menu title Utilities
	include stdmenu.cfg
	label mainmenu
		menu label ^Back..
		menu exit
	include utilities.cfg
menu end

menu clear
