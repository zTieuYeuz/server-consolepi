# Console System - cho phep dang nhap SSH bang mat khau.
#
# LOI THAT (20/09/2026, thu SSH vao ISO dang chay va bi tu choi ngay:
# "Permission denied (publickey)"): anh dia mac dinh chi nhan khoa cong
# khai. Nhung nguoi dung vua cai may xong thi CHUA CO khoa nao ca - ho chi
# co tai khoan va mat khau vua dat trong trinh cai dat. Ket qua la SSH bat
# san nhung khong ai vao duoc, trong nhu loi.
PasswordAuthentication yes
KbdInteractiveAuthentication no

# Khong cho dang nhap thang bang root qua mang - dung tai khoan thuong roi
# sudo. Day la thoi quen an toan chuan, va cung khop cach dashboard xac
# thuc (tai khoan Linux thuong qua PAM).
PermitRootLogin no
