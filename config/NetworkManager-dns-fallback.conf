# Console Pi - DNS du phong LUON CO, bat ke giao dien nao dang chay
#
# LOI THAT DA GAP (tai hien duoc 100%): rut day mang ra, chi con WiFi thi
# /etc/resolv.conf BI XOA TRANG HOAN TOAN - khong con dong nameserver nao.
# Internet van thong qua WiFi, nhung khong phan giai duoc ten mien nao ca
# ("Temporary failure in name resolution") -> cloudflared khong tim duoc
# region1.v2.argotunnel.com -> DUONG HAM TU XA CHET.
#
# NGUYEN NHAN: tren may nay eth0 do NetworkManager quan ly, con wlan0 do
# systemd-networkd quan ly (co y, de che do AP hoat dong dung). NetworkManager
# la ben ghi /etc/resolv.conf, nhung no KHONG BIET GI ve DNS cua wlan0 - nen
# khi eth0 ngat, no xoa DNS cua eth0 di va ghi ra file RONG.
#
# CACH SUA: khai bao DNS o day, NetworkManager se LUON ghi 2 dong nay vao
# resolv.conf du co giao dien nao hay khong. Mat DNS noi bo do DHCP cap
# (khong phan giai duoc ten may noi bo trong LAN), doi lai INTERNET VA
# DUONG HAM TU XA LUON HOAT DONG o bat ky mang nao - dung uu tien cho mot
# thiet bi mang di hien truong, va dan mang lam viec voi switch/router thi
# dung dia chi IP la chinh chu it khi dung ten.
# [global-dns] la "cong tac chinh" bat che do global DNS - PHAI co mat (du
# de trong) thi cac section [global-dns-domain-*] ben duoi moi co hieu luc.
# Thieu dong nay la lo hong that co the gap: file van hop le cu phap, KHONG
# bao loi gi ca, nhung DNS du phong bi bo qua am tham - tuong da sua nhung
# thuc ra chua co tac dung gi.
[global-dns]

[global-dns-domain-*]
servers=1.1.1.1,8.8.8.8
