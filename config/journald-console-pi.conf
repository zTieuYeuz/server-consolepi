# Console System - nhat ky he thong (journal) chi giu 7 NGAY
#
# Yeu cau cua tac gia (27/09/2026): TOAN BO nhat ky tren may chi giu 7 ngay
# (truoc day giu 60 ngay). 7 ngay du de xem lai su co tuan qua ma the nho /
# o dia khong phai chua nhat ky cu vo ich.
#
# Storage=persistent: van ghi xuong dia (khong chi RAM) de khoi dong lai
# khong mat nhat ky cua nhung ngay truoc. MaxRetentionSec=7day: journald tu
# xoa cac file journal cu hon 7 ngay. SystemMaxUse=200M chan tran phong khi
# 1 dich vu loi lap lai lien tuc.
#
# (c) 2026 zTieuYeuz - Console System
[Journal]
Storage=persistent
MaxRetentionSec=7day
MaxFileSec=1day
SystemMaxUse=200M
SystemKeepFree=1G
