# Console Pi - giu nhat ky he thong (journal) it nhat 60 ngay
#
# VI SAO CAN: nhieu su co thuc te (dich vu console-pi-tunnel tu dung, loi
# mang, dich vu Bluetooth crash...) chi de lai dau vet trong journal cua
# systemd, KHONG phai trong cac file /var/log/console-pi-*.log rieng. May
# nay dung o hien truong (cong ty khach, khong SSH vao duoc luc do) nen
# phai doi VE NHA moi xem lai duoc - neu journal da xoay vong mat truoc do
# thi coi nhu mat dau vet vinh vien.
#
# Mac dinh cua systemd-journald KHONG dam bao thoi gian giu lai (chi gioi
# han theo dung luong, va gioi han do co the rat lon tuy dung luong dia
# trong) - phai ep ro bang MaxRetentionSec de dam bao it nhat 60 ngay.
#
# SystemMaxUse=500M: the SD 29GB con hon 20GB trong (da do that luc viet
# file nay) nen 500M la an toan, khong lo day the. Storage=persistent de
# chac chan journal duoc ghi vao dia (khong chi trong RAM, mat khi tat may).
[Journal]
Storage=persistent
MaxRetentionSec=60day
SystemMaxUse=500M
SystemKeepFree=1G
