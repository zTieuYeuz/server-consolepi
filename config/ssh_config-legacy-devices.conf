# Console Pi - cho phep SSH client CUA CHINH PI ket noi toi thiet bi mang cu
#
# LY DO: OpenSSH ban moi (tu ~7.x tro di, va nhat la OpenSSH 9.x/10.x tren
# Debian trixie) da bo mac dinh cac thuat toan KEX/host-key/cipher dua tren
# SHA-1 va DES vi khong con an toan. Nhung switch/router/iLO doi cu (thiet
# bi CHINH LA thu Console Pi duoc dung de chan doan khi mang da hong) hau
# het chi ho tro dung nhung thuat toan cu nay - ket qua that gap:
#   "Unable to negotiate with <ip> port 22: no matching key exchange
#    method found. Their offer: diffie-hellman-group-exchange-sha1,
#    diffie-hellman-group14-sha1,diffie-hellman-group1-sha1"
#
# LOI THAT DA GAP luc viet file nay: them "ssh-dss" vao HostKeyAlgorithms/
# PubkeyAcceptedAlgorithms lam ssh BAO LOI PARSE VA TU CHOI CHAY HOAN TOAN
# ("Bad key types") - ssh-dss khong con duoc OpenSSH 10 BIEN DICH VAO nua
# (khac voi cac thuat toan KEX o tren, cac thuat toan do van con trong ma
# nguon, chi bi TAT MAC DINH). Vi vay o day CHI dung ssh-rsa, khong dung
# ssh-dss du mot so thiet bi rat cu co the can no.
#
# Day CHI la cau hinh cho SSH CLIENT (lenh `ssh` chay tu Pi di ra), khong
# dung gi den SSH SERVER cua chinh Pi (sshd van giu nguyen do bao mat that,
# khong bi noi long o day).
#
# Dau + nghia la THEM vao danh sach mac dinh (khong thay the) - Pi van uu
# tien thuat toan hien dai truoc khi thu tuong thich nguoc voi thiet bi cu.
Host *
    KexAlgorithms +diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
    HostKeyAlgorithms +ssh-rsa
    PubkeyAcceptedAlgorithms +ssh-rsa
    Ciphers +aes128-cbc,aes192-cbc,aes256-cbc,3des-cbc
