# Console Pi - nginx lam cong trung gian (reverse proxy)
#
# TAI SAO CAN: truoc day terminal chay o cong rieng (8010/8011) va tu bao ve
# bang mat khau HTTP co ban. Trinh duyet CAM iframe khac origin hien hop thoai
# nhap mat khau (chong lua dao), nen khung terminal luon bao loi.
#
# Gio moi thu chung cong 80 -> cung origin -> iframe chay binh thuong, va
# terminal dung luon phien dang nhap cua dashboard (khong con mat khau rieng).
#
# Luong: trinh duyet -> nginx:80 -> Flask 127.0.0.1:5000  (giao dien)
#                               -> ttyd 127.0.0.1:801x    (terminal, co WebSocket)
# Cac ttyd chi lang nghe tren 127.0.0.1 nen KHONG the vao thang tu mang.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cong console: ttyUSB0 -> 8001, ttyUSB1 -> 8002, ...
map $cdev $console_port {
    ttyUSB0 8001;
    ttyUSB1 8002;
    ttyUSB2 8003;
    ttyUSB3 8004;
    default 8001;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;

    # Kiem tra phien dang nhap - hoi Flask
    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:5000/_auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Chua dang nhap -> chuyen ve trang login thay vi bao loi 401 kho hieu
    error_page 401 = @go_login;
    location @go_login {
        return 302 /login;
    }

    # ---- Terminal local ----
    location /term-local/ {
        auth_request /_auth;
        proxy_pass       http://127.0.0.1:8010/term-local/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ---- Terminal cho SSH ----
    location /term-ssh/ {
        auth_request /_auth;
        proxy_pass       http://127.0.0.1:8011/term-ssh/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ---- Console serial (ttyUSB0..3) ----
    location ~ ^/term-console/(?<cdev>ttyUSB[0-9]+)/(?<crest>.*)$ {
        auth_request /_auth;
        proxy_pass       http://127.0.0.1:$console_port/term-console/$cdev/$crest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ---- Dashboard (Flask) ----
    location / {
        proxy_pass       http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
