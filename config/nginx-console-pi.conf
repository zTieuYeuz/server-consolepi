# Console Pi - nginx lam cong trung gian (reverse proxy)
#
# TAI SAO CAN: truoc day terminal chay o cong rieng (8010/8011) va tu bao ve
# bang mat khau HTTP co ban. Trinh duyet CAM iframe khac origin hien hop thoai
# nhap mat khau (chong lua dao), nen khung terminal luon bao loi.
#
# Gio moi thu chung cong 80 -> cung origin -> iframe chay binh thuong, va
# terminal dung luon phien dang nhap cua dashboard (khong con mat khau rieng).
#
# Luong: trinh duyet -> nginx:80 -> Flask 127.0.0.1:5000  (giao dien)
#                               -> ttyd 127.0.0.1:801x    (terminal, co WebSocket)
# Cac ttyd chi lang nghe tren 127.0.0.1 nen KHONG the vao thang tu mang.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# PHAN BIET "MAN HINH GAN TREN PI" VOI "NGUOI TU INTERNET"
#
# Man hinh cam ung tren Pi duoc vao thang khong can dang nhap. Truoc day dieu
# kien la "dia chi nguoi goi = 127.0.0.1".
#
# LO HONG: cloudflared chay NGAY TREN Pi va cung goi vao 127.0.0.1:80. Nen moi
# nguoi di qua duong ham Cloudflare deu bi cham nham la man hinh tai cho ->
# vao thang dashboard va terminal quyen root MA KHONG CAN MAT KHAU. Da kiem
# chung that: goi kem X-Forwarded-For tu 127.0.0.1 tra ve 200 thay vi 302.
#
# CACH VA: khong con dua vao dia chi IP nua - dua vao CONG MA REQUEST DI VAO.
#   - cong 80          : duong cong cong (LAN, WiFi, Cloudflare) -> luon phai dang nhap
#   - cong 8880        : chi lang nghe tren loopback, danh RIENG cho trinh duyet
#                        kiosk tren man hinh Pi -> duoc mien dang nhap
# cloudflared tro vao cong 80 nen khong bao gio duoc mien.
#
# Header X-ConsolePi-Local duoc nginx GHI DE o ca hai cong, nen nguoi ngoai
# co tu gui header nay cung bi xoa sach.
# ---------------------------------------------------------------------------
map $server_port $cp_man_hinh_tai_cho {
    default "";
    8880    "1";
}

# Cong console. Hai ho thiet bi dung dai cong rieng:
#   ttyUSB* = cap dung chip chuyen doi (FTDI, Prolific, CH340...)
#   ttyACM* = thiet bi CDC-ACM, vi du cap console micro-USB cua Cisco
# Phai khop voi console_port_for() trong ui/home.py va scripts/ttyd-one.sh.
map $cdev $console_port {
    ttyUSB0 8001;
    ttyUSB1 8002;
    ttyUSB2 8003;
    ttyUSB3 8004;
    ttyACM0 8005;
    ttyACM1 8006;
    ttyACM2 8007;
    ttyACM3 8008;
    default 8001;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Cong rieng cho trinh duyet kiosk tren man hinh Pi. Chi lang nghe tren
    # loopback nen khong the goi toi tu mang; cloudflared tro vao cong 80.
    listen 127.0.0.1:8880;
    server_name _;

    # File ISO/firmware co the vai GB. 64m mac dinh thi tai len nao cung
    # truot voi loi "413 Request Entity Too Large" kho hieu.
    client_max_body_size 8g;
    # Khong dat thoi gian cho ngan: tai 5GB qua WiFi mat vai chuc phut
    client_body_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    # Ghi thang ra dia thay vi giu trong bo nho - Pi it RAM
    client_body_buffer_size 256k;

    # Kiem tra phien dang nhap - hoi Flask
    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:5000/_auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-ConsolePi-Local $cp_man_hinh_tai_cho;
    }

    # Chua dang nhap -> chuyen ve trang login thay vi bao loi 401 kho hieu
    error_page 401 = @go_login;
    location @go_login {
        return 302 /login;
    }

    # ---- Terminal local ----
    location /term-local/ {
        auth_request /_auth;
        proxy_pass       http://127.0.0.1:8010/term-local/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ---- Terminal cho SSH ----
    location /term-ssh/ {
        auth_request /_auth;
        proxy_pass       http://127.0.0.1:8011/term-ssh/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ---- Console serial (ttyUSB0..3) ----
    location ~ ^/term-console/(?<cdev>tty(?:USB|ACM)[0-9]+)/(?<crest>.*)$ {
        auth_request /_auth;
        proxy_pass       http://127.0.0.1:$console_port/term-console/$cdev/$crest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ---- Dashboard (Flask) ----
    location / {
        proxy_pass       http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GHI DE - khong phai them. Nguoi ngoai co tu gui header nay thi cung
        # bi thay bang gia tri cua nginx (rong o cong 80).
        proxy_set_header X-ConsolePi-Local $cp_man_hinh_tai_cho;
        proxy_read_timeout 300;
    }
}
