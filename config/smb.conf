# Console Pi - chia se toi thieu de WinPE (Windows Setup qua mang) lay
# duoc install.wim that su - boot.wim (WinPE) di qua TFTP/HTTP nhung
# install.wim (4.4GB, anh Windows that) khong the nhoi vao goi PXE/wimboot,
# CAN 1 duong mang de Setup tu ket noi lay ve trong luc dang cai.
#
# LOI THAT DA GAP (khong doan, da kiem chung that qua nhieu vong boot may
# ao that): ban dau dung "guest ok" (dang nhap khach an danh, khong mat
# khau). Windows Setup (InstallFrom/Path) TU MINH ket noi UNC rieng,
# KHONG dung chung phien voi bat ky `net use` thu cong nao da chay truoc
# do trong cung WinPE (da kiem chung: `net use` thu cong bao "completed
# successfully" nhung setup.exe VAN bao "specified file does not exist"
# khi tu no ket noi lai) - rat co the do Windows hien dai (tu 1709+) MAC
# DINH CHAN dang nhap khach an danh qua SMB (chinh sach "insecure guest
# logon"), ap dung ngay ca khi Samba phia server cho phep guest.
#
# SUA DUNG: dung tai khoan Samba THAT (khong phai guest) - autounattend.xml
# tu goi <Credentials> ngay trong <InstallFrom> (tinh nang chinh thuc cua
# Microsoft, xem learn.microsoft.com "InstallFrom (...)") - Setup tu xac
# thuc bang tai khoan nay khi no tu ket noi, khong can RunSynchronousCommand
# `net use` nao ca. Tai khoan "consolepi-deploy" la user he thong RIENG,
# KHONG the dang nhap SSH/local (nologin), CHI dung de xac thuc Samba doc.
# Mat khau tai khoan nay KHONG nam trong file nay hay trong code - install.sh
# tu sinh ngau nhien va luu vao /opt/console-pi/samba-deploy.key (600, chi
# root doc duoc) - xem ui/unattend.py: _doc_hoac_tao_mat_khau_samba().
[global]
   workgroup = WORKGROUP
   server string = Console Pi
   security = user
   map to guest = Bad User
   guest account = nobody
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 50
   dns proxy = no
   smb ports = 445

# ------------------------------------------------------------------
# LOI THAT DA GAP (tim ra bang tcpdump + ss tren chinh Pi): may cai
# Windows bi reset giua chung -> khong kip gui FIN/RST -> Pi VAN giu
# ket noi SMB cu o trang thai ESTABLISHED. Lan boot sau, WinPE cap
# DUNG cung so cong nguon va DHCP cap dung cung IP -> trung y het
# 4-tuple cu -> nhan Linux tra "challenge ACK" thay vi SYN-ACK ->
# Windows bao "System error 53". Day la nguyen nhan GOC cua hien
# tuong "luc cai duoc luc khong".
# Lop chan chinh: ui/pxe.py tu goi `smbcontrol smbd kill-client-ip`
# ngay luc may do bat dau boot. 3 dong duoi la lop du phong: de nhan
# tu phat hien va don ket noi chet, khong phu thuoc vao lop tren.
   deadtime = 1
   keepalive = 60
   socket options = TCP_NODELAY SO_KEEPALIVE

[deploy]
   path = /opt/console-pi/deploy
   browseable = yes
   read only = yes
   valid users = consolepi-deploy
   force user = nobody
   # TAT OPLOCK - bat buoc voi share nay.
   #
   # LOI THAT DA GAP (12/09/2026): dang cai Windows ma tat may giua
   # chung, roi boot lai NGAY thi lan boot thu 2 bao "khong ket noi
   # duoc kho trien khai"; phai boot them lan nua moi duoc. Ly do:
   # WinPE chet giua luc dang doc file lon (stream.x64.x-none.dat
   # ~2.7GB), Samba khong he biet client da chet nen VAN GIU oplock
   # tren file do. Phien moi mo dung file ay bi chan, cho oplock cu
   # vo hieu - ma phien chet chi duoc don sau `deadtime` (khi do la
   # 3 phut). Dung bang thoi gian anh Thoai phai cho.
   #
   # Share nay CHI DOC va chi phuc vu may dang boot, khong co ai sua
   # file dong thoi - oplock (co che cho phep client cache file de
   # tang toc) khong dem lai loi ich gi o day, chi gay ket.
   oplocks = no
   level2 oplocks = no
