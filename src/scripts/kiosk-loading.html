<!DOCTYPE html>
<!--
Console Pi - Man hinh cho luc khoi dong kiosk

LOI THAT DA GAP: kiosk-start.sh cu bat Chromium tro THANG vao dashboard va
tu doi bang mot vong lap `curl` trong shell (toi da 60 giay) TRUOC KHI mo
trinh duyet. Nhung tren Pi, luc moi khoi dong dia rat ban (hang chuc dich
vu cung khoi dong, Flask phai nap scapy/cryptography/netmiko/tat ca module
nettools) nen doi khi Flask can HON 60 GIAY moi san sang - luc do trinh
duyet da mo san va hien loi "khong ket noi duoc", nguoi dung phai tu bam
Reload. Va trong luc cho, man hinh khong co gi bao hieu dang chay hay da
treo.

Cach sua: KHONG doi trong shell nua. Mo TRANG NAY ngay lap tuc (file tinh,
luon mo duoc, khong phu thuoc Flask/nginx da chay hay chua) - chinh trang
nay tu kiem tra dashboard da san sang chua bang JavaScript, hien thanh
tien trinh trong luc cho, roi TU CHUYEN sang dashboard that ngay khi san
sang. Nguoi dung khong bao gio thay trang loi "khong ket noi duoc" nua.

LOI THAT DA GAP LAN 2 (anh Thoai bao thanh tien trinh "chay den 92% roi
dung, bao lau hon binh thuong"): ban dau % chi DOAN theo THOI GIAN DA TROI
QUA, khong biet gi ve viec Flask thuc su dang lam gi - khi khoi dong cham
hon binh thuong, no dung ngay tai muc tran da dat san, nhin y het bi treo
du Flask van dang nap binh thuong.

Da sua: doc THEM file trang thai THAT (`/run/console-pi-boot-status.json`)
do chinh app.py ghi lai tai tung moc that su trong luc nap (xem
_bao_tien_do() trong app.py) - vd "dang nap cac cong cu chan doan mang"
khi dang o dong import scapy/cryptography/netmiko. Neu doc duoc file nay
thi dung % VA THONG DIEP THAT thay vi doan; chi doan theo thoi gian trong
khoang ngan truoc khi Flask kip ghi moc dau tien.

LOI KY THUAT RIENG DA GAP KHI LAM PHAN NAY: trang `file://` KHONG the
`fetch()` MOT FILE CUC BO KHAC (ke ca file trong cung thu muc) theo mac
dinh cua Chromium - da kiem chung that (fetch tra ve
"TypeError: Failed to fetch"), khac han voi fetch sang dia chi http:// van
chay binh thuong. Phai them co `--allow-file-access-from-files` cho
Chromium (xem scripts/kiosk-start.sh) - da kiem chung lai voi co nay bang
1 tien trinh Chromium rieng thi fetch file-to-file thanh cong.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Pi - Dang khoi dong</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #15171a; color: #e6e6e6;
    font-family: system-ui, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .khoi { text-align: center; max-width: 440px; padding: 20px; }
  .logo { font-size: 22px; font-weight: 700; color: #4CAF50; letter-spacing: .5px; margin-bottom: 6px; }
  .phu { color: #8b93a1; font-size: 13px; margin-bottom: 28px; }
  .thanh-ngoai {
    width: 100%; height: 10px; background: #22262b; border-radius: 6px;
    overflow: hidden; border: 1px solid #2c3036;
  }
  .thanh-trong {
    height: 100%; width: 4%; background: #4CAF50; border-radius: 6px;
    transition: width .4s ease;
  }
  .phan-tram { margin-top: 12px; font-size: 13px; color: #a8b0bd; font-family: ui-monospace, monospace; }
  .thong-diep { margin-top: 18px; font-size: 13px; color: #6b7280; min-height: 18px; }
  .cham { display: inline-block; width: 10px; text-align: left; }
  .canh-bao {
    margin-top: 22px; padding: 12px 15px; background: #3a2f14; border-left: 4px solid #f59e0b;
    border-radius: 6px; font-size: 13px; color: #e6e6e6; display: none; text-align: left;
  }
  .canh-bao button {
    margin-top: 10px; padding: 9px 16px; background: #4CAF50; color: #fff; border: none;
    border-radius: 6px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="khoi">
    <div class="logo">CONSOLE PI</div>
    <div class="phu">Dang khoi dong cac dich vu he thong...</div>
    <div class="thanh-ngoai"><div class="thanh-trong" id="thanh"></div></div>
    <div class="phan-tram" id="phantram">4%</div>
    <div class="thong-diep" id="thongdiep">Dang cho dashboard san sang<span class="cham" id="cham"></span></div>
    <div class="canh-bao" id="canhbao">
      Dang mat nhieu thoi gian hon binh thuong. Dich vu co the dang gap
      su co - thu tai lai trang, hoac kiem tra bang cach SSH/gan man hinh
      HDMI khac vao xem nhat ky he thong.
      <div><button onclick="location.reload()">Tai lai trang nay</button></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var DASH_URL = "http://127.0.0.1:8880/";
  var STATUS_URL = "file:///run/console-pi-boot-status.json";

  // Uoc luong thoi gian khoi dong TYPICAL - CHI dung khi CHUA doc duoc
  // trang thai that (vd vai giay dau tien, truoc khi app.py kip ghi moc
  // dau). Ngay khi co du lieu that, bo qua so nay hoan toan.
  var GIAY_UOC_TINH = 12;
  var GIAY_CANH_BAO_TONG = 75;     // an toan cuoi cung du co du lieu that hay khong
  var GIAY_CANH_BAO_KET = 25;      // % that KHONG doi qua lau = that su ket o 1 buoc

  var bat_dau = Date.now();
  var thanh = document.getElementById("thanh");
  var phantram = document.getElementById("phantram");
  var thongdiep = document.getElementById("thongdiep");
  var canhbao = document.getElementById("canhbao");
  var cham = document.getElementById("cham");
  var soCham = 0;

  var tyLeThat = null;          // % doc duoc tu file trang thai, null = chua co
  var tyLeThatLanCuoiDoi = 0;    // lan gan nhat % that THAY DOI (de phat hien ket)

  function capNhatCham() {
    soCham = (soCham + 1) % 4;
    cham.textContent = ".".repeat(soCham);
  }

  function ve(tyLe, diep) {
    thanh.style.width = tyLe + "%";
    phantram.textContent = tyLe + "%";
    if (diep) thongdiep.textContent = diep;
  }

  function capNhatHienThi() {
    var giay = (Date.now() - bat_dau) / 1000;

    if (tyLeThat !== null) {
      // Co du lieu THAT tu app.py - dung thang, khong doan nua.
      ve(tyLeThat, null);
    } else {
      // Chua co du lieu that (thuong chi vai giay dau) - tam doan theo
      // thoi gian, khong bao gio vuot 30% de khong lan voi so % THAT sau do.
      var uocLuong = Math.min(30, Math.round((giay / GIAY_UOC_TINH) * 100));
      ve(uocLuong, null);
    }

    var ket_qua_lau = tyLeThat !== null &&
      (Date.now() - tyLeThatLanCuoiDoi) / 1000 >= GIAY_CANH_BAO_KET;
    if (giay >= GIAY_CANH_BAO_TONG || ket_qua_lau) {
      canhbao.style.display = "block";
    }
  }

  function docTrangThaiThat() {
    // file:// KHONG the fetch() 1 file cuc bo khac neu thieu co
    // --allow-file-access-from-files (da kiem chung that, xem ghi chu
    // dau file) - kiosk-start.sh da bat co nay. Neu vi ly do gi do co nay
    // thieu, fetch se luon that bai va trang tu dong quay ve uoc luong
    // theo thoi gian o tren - khong bi vo trang, chi mat phan chinh xac.
    fetch(STATUS_URL, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var tyLeMoi = Math.max(0, Math.min(99, parseInt(d.phan_tram, 10) || 0));
        if (tyLeMoi !== tyLeThat) {
          tyLeThat = tyLeMoi;
          tyLeThatLanCuoiDoi = Date.now();
          if (d.thong_diep) thongdiep.textContent = d.thong_diep;
        }
      })
      .catch(function () { /* chua co file, hoac dang ghi do - thu lai vong sau */ });
  }

  function kiemTraSanSang() {
    // no-cors: khong doc duoc noi dung/status that su (khac goc file:// so
    // voi http://127.0.0.1:8880), nhung fetch CHI resolve() (khong throw)
    // khi ket noi TCP+HTTP thanh cong - du la loai "opaque response" thi
    // van la tin hieu dang tin cay de biet server da lang nghe va tra loi.
    fetch(DASH_URL, { mode: "no-cors", cache: "no-store" })
      .then(function () {
        ve(100, "Da xong, dang mo dashboard...");
        setTimeout(function () { window.location.href = DASH_URL; }, 300);
      })
      .catch(function () {
        setTimeout(kiemTraSanSang, 1000);
      });
  }

  setInterval(capNhatHienThi, 300);
  setInterval(capNhatCham, 500);
  setInterval(docTrangThaiThat, 800);
  docTrangThaiThat();
  kiemTraSanSang();
})();
</script>
</body>
</html>
