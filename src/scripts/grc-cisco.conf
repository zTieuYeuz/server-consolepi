# Console Pi - To mau output thiet bi mang (Cisco IOS va tuong tu)
#
# Dung voi grcat:  grcat /opt/console-pi/scripts/grc-cisco.conf < file
# hoac qua alias:  cisco <ten-file>
#
# Nguyen tac chon mau (de doc nhanh, khong roi mat):
#   do    = van de / down / error
#   xanh la = tot / up / connected
#   vang  = canh bao / trang thai trung gian
#   xanh duong = dia chi IP / MAC (thong tin nhan dang)
#   tim   = ten cong / interface

# --- Trang thai xau: do dam ---
regexp=(?i)\b(down|err-disabled|errdisable|shutdown|failed|denied|deny|reject|invalid|error|crc|collision|drop(s|ped)?|unreachable|timeout|lost|inactive|blocked|blocking|discarding)\b
colours=bold red
=======
# --- Trang thai tot: xanh la ---
regexp=(?i)\b(up|connected|established|active|forwarding|permit|success|ok|enabled|reachable|full-duplex|synchronized)\b
colours=bold green
=======
# --- Canh bao / trung gian: vang ---
regexp=(?i)\b(warning|notice|half-duplex|learning|listening|standby|pending|administratively|auto|unknown|notconnect|disabled)\b
colours=bold yellow
=======
# --- Dia chi IPv4 (kem prefix neu co) ---
regexp=\b\d{1,3}(\.\d{1,3}){3}(/\d{1,2})?\b
colours=bold cyan
=======
# --- Dia chi MAC: aabb.ccdd.eeff (Cisco) va aa:bb:cc:dd:ee:ff ---
regexp=\b([0-9a-fA-F]{4}\.){2}[0-9a-fA-F]{4}\b
colours=bold blue
=======
regexp=\b([0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}\b
colours=bold blue
=======
# --- Ten cong/interface Cisco ---
regexp=\b((Gigabit|TenGigabit|FastEthernet|Ethernet|Serial|Loopback|Port-channel|Vlan|Tunnel|Management)\w*\s?[\d/\.]+)\b
colours=bold magenta
=======
# --- Ten cong viet tat: Gi0/1, Fa0/24, Te1/0/1, Po1 ---
regexp=\b(Gi|Fa|Te|Et|Se|Lo|Po|Vl|Tu|Mg)\d+(/\d+)*(\.\d+)?\b
colours=bold magenta
=======
# --- VLAN ---
regexp=(?i)\bvlan\s?\d{1,4}\b
colours=bold yellow
=======
# --- Dau nhac cua thiet bi: Router#, Switch(config)# ---
regexp=^\S+(\(config[^)]*\))?[#>]
colours=bold white
=======
# --- Dong tieu de bang (cot chu hoa) ---
regexp=^[A-Z][A-Za-z\-\s]{4,}$
colours=underline
=======
# --- So lieu dung luong / toc do ---
regexp=\b\d+\s?(bps|Kbps|Mbps|Gbps|packets|bytes|errors)\b
colours=cyan
